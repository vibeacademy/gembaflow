name: Agent Merge Gate

# Conditional unlock that lets the `/drain` skill merge PRs to main
# autonomously overnight. CLAUDE.md Critical Rule #4 ("Only humans
# merge PRs") is deliberately overridden here for a narrow trigger
# context. See:
#   - docs/agent-merge-gate.md      — operational guide + revert procedure
#   - docs/safety-classes.md        — the safety:* taxonomy enforced by conditions 1–2
#
# Reverting the unlock: delete this file. Drain's call fails; merge
# permission is back to humans-only with zero other code changes.
#
# This workflow ships in the framework's beads-native state (epic #574
# E4, per the validated autonomous drain run on the reference fork —
# 3/3 shipped, 0 claim races). Beads adaptation: work items live in
# the local bd tracker, not GitHub Issues, and Actions runners cannot
# query the local Dolt DB. The safety class therefore travels ON THE
# PR: the worker copies the bead's safety:* label onto the PR at
# creation (label authority: the bead is the source of truth) and
# cites the bead in the body ("Bead: <id>"). Conditions 1+2 read the
# PR's own labels and body; the old closingIssuesReferences /
# linked-issue path (and its issues:read permission) is gone.
#
# There is deliberately NO approved-review condition: the framework's
# pr-reviewer never clicks Approve — the GO/NO-GO verdict lives in
# review comments and as a `verdict:*` label on the bead, and /drain
# dispatches this gate only after a GO verdict. The gate re-verifies
# the mechanical conditions (defense in depth), not the editorial
# verdict. Forks whose reviewer bot DOES post --approve may add a
# review-state condition as a fork-local override.
#
# Condition logic for conditions 1–5 lives in
# scripts/check-merge-gate.sh (unit-tested in
# scripts/__tests__/check-merge-gate.test.mjs); this workflow fetches
# the PR state and delegates.

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
        description: PR number to merge
      dry_run:
        required: false
        type: boolean
        default: false
        description: When true, run all condition checks but skip the actual merge
      caller:
        required: false
        type: string
        default: unknown
        description: Identifier of the calling workflow (audit trail only)
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: number
        description: PR number to merge
      dry_run:
        required: false
        type: boolean
        default: true
        description: Defaults to true for human dispatch; set false only when explicitly testing real merges
      caller:
        required: false
        type: string
        default: workflow_dispatch
        description: Identifier of the dispatching context (audit trail only — the "Force dry-run for non-drain workflow_dispatch" step still gates real merges to workflow_call only)

permissions:
  contents: read
  pull-requests: read

jobs:
  verify-and-merge:
    name: Verify 6 conditions and merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # checks: read + actions: read are required to read the
      # statusCheckRollup GraphQL field. Without them, condition 3
      # (all CI checks SUCCESS) fails at the fetch step with
      # "Resource not accessible by integration".
      # issues: read is NOT needed since the beads cutover — conditions
      # 1+2 read the PR's own body and labels, never a linked issue.
      checks: read
      actions: read
    env:
      PR: ${{ inputs.pr_number }}
      DRY_RUN: ${{ inputs.dry_run }}
      CALLER: ${{ inputs.caller || 'workflow_dispatch' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # IGNORED_CHECKS lists status-check names that condition 3 should
      # treat as informational (NOT required for merge). Empty list means
      # strict-mode (every rollup check must SUCCESS/NEUTRAL/SKIPPED and
      # the rollup must be COMPLETE) — the framework default. Add a check
      # name ONLY when it meets all three criteria in
      # docs/agent-merge-gate.md § "Informational checks": genuinely
      # informational AND empirically flaky/laggy enough to block
      # legitimate merges AND not the only coverage of a code path.
      #
      # Rationale anecdote (fork drain run va-17h, finding 1): the
      # fork's first autonomous dispatch was denied because a
      # provider-side informational check lagged CI by ~10 minutes —
      # strict mode correctly refused the incomplete rollup. The fix is
      # either the drain waiting for the FULL rollup before dispatching
      # (the codified default, drain.md per-iteration step 7a) or an
      # IGNORED_CHECKS entry meeting the 3-criteria bar. Upstream's own
      # CI has no deploy/preview chain in the gate's required set, so
      # the framework ships strict.
      IGNORED_CHECKS: '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit trail
        run: |
          echo "=== Agent Merge Gate invocation ==="
          echo "PR: #${PR}"
          echo "Trigger: ${{ github.event_name }}"
          echo "Caller: ${CALLER}"
          echo "Actor: ${{ github.actor }}"
          echo "Dry run: ${DRY_RUN}"
          echo "Run ID: ${{ github.run_id }}"

      - name: Force dry-run for non-drain workflow_dispatch
        # workflow_dispatch is only allowed for testing — real merges
        # must come from /drain via workflow_call with caller set.
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        run: |
          echo "::error::workflow_dispatch invocations MUST set dry_run=true. Real merges are reserved for workflow_call from /drain (caller=goal-drain)."
          exit 1

      - name: Fetch PR state
        id: pr
        run: |
          if ! gh pr view "${PR}" --json number,state,baseRefName,labels,body,statusCheckRollup,mergeStateStatus > /tmp/pr.json 2>/tmp/pr.err; then
            echo "::error::Cannot read PR #${PR}: $(cat /tmp/pr.err)"
            exit 1
          fi
          jq '{number, state, baseRefName, mergeStateStatus}' /tmp/pr.json

      - name: Conditions 1-5 — citation, safety label, rollup, open/base, do-not-merge
        # Delegates to the unit-tested condition script. IGNORED_CHECKS
        # and the (implicit) EXPECTED_BASE=main flow through the env.
        run: bash scripts/check-merge-gate.sh /tmp/pr.json

      - name: Condition 6 — caller is drain (audit-only, non-blocking)
        # Architecturally the gate is intended for /drain only.
        # We can't cryptographically prove the caller from inside the
        # called workflow, so we record the claimed caller in the audit
        # log. The 5 other conditions are the real safety enforcement.
        run: |
          if [ "${CALLER}" != "goal-drain" ]; then
            echo "::warning::Caller is '${CALLER}' (expected 'goal-drain'). All other conditions still gate the merge."
          else
            echo "OK: caller = goal-drain"
          fi

      - name: All 6 conditions verified
        run: |
          echo "::notice::All conditions passed for PR #${PR}. ${DRY_RUN}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run mode — skipping the actual merge."
          fi

      - name: Merge
        if: inputs.dry_run != true
        run: |
          gh pr merge "${PR}" --squash --delete-branch
          echo "::notice::Merged PR #${PR} (squash) and deleted source branch."
