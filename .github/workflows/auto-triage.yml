name: Auto Triage

on:
  issues:
    types: [labeled]

jobs:
  auto-triage:
    name: Triage auto-detected bugs
    runs-on: ubuntu-latest
    if: >-
      github.event.label.name == 'bug:auto'
      && github.event.issue.user.login != 'github-actions[bot]'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check for existing triage comment
        id: check_comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            });

            const alreadyTriaged = comments.some(c =>
              c.body.includes('Auto-Triage')
              && c.user.type === 'Bot'
            );

            core.setOutput('already_triaged', alreadyTriaged.toString());

      - name: Post triage comment
        if: steps.check_comment.outputs.already_triaged != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '## Auto-Triage',
                '',
                'This bug was automatically detected from a production error.',
                '',
                'To fix it, run:',
                '',
                '```',
                `/work-ticket #${issueNumber}`,
                '```',
                '',
                'The agent will read the error details above, create a fix,',
                'and open a pull request for your review.',
                '',
                '---',
                '*Automated by auto-triage workflow.*',
              ].join('\n'),
            });

      # Note: no priority label is applied. Priority is canonical on the project
      # board's Priority field, not a repo label (per docs/TICKET-FORMAT.md and #337
      # / #405). The "## Auto-Triage" comment above is the workflow's idempotency
      # marker AND its operator-facing signal that triage ran.
