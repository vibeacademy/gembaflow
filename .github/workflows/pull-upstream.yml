name: Pull Upstream

on:
  workflow_dispatch:
    inputs:
      direct:
        description: Apply changes directly to main (skip PR). Use for emergency mid-workshop fixes.
        type: boolean
        default: false
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  pull-upstream:
    name: Pull framework updates from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run pull-upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ${{ inputs.direct }}; then
            bash scripts/pull-upstream.sh --direct
          else
            bash scripts/pull-upstream.sh
          fi
