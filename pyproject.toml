[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agile-flow"
version = "0.1.0"
description = "Agile Flow Framework"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0",
    "pytest-bdd>=7.0",
]

[tool.setuptools.packages.find]
include = ["features*"]
exclude = ["app*", "reports*", "starters*", "node_modules*"]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["features"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--tb=short",
    "--strict-markers",
]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
]
ignore = []